[project]
name = "stringency-plugins"
version = "0.0.0"
description = "Domain plugins for the stringency engine, one package per plugins/<name>"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
stringency = { git = "https://github.com/santangelo-lab/stringency", tag = "v0.2.19" }
stringency-singlecell = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "stringency-singlecell",
    "pyarrow>=25.0.1",
    "h5py>=3.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["plugins/*/tests"]
markers = [
    "institutional: needs data or a method checkout on the lab workstation; skipped elsewhere with the path named",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["tools/"]  # the extractor scripts run inside module images; typing them is a later cleanup

[tool.ruff.lint.isort]
known-first-party = ["stringency_singlecell", "stringency_bulkrna"]
