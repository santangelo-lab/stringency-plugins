# cell_types_mouse@1: the closed label set of the cluster-annotation judgment (annotate_clusters)
# for the four Lyons CLP organs: liver, spleen, lung, small intestine. One list for all four so a
# cluster of lymphoid or myeloid cells gets the same label in every organ and the cross-organ
# tables join on it (Lane F plan, phase 7). Labels are at the level ROSC_MTA2's collapse map calls
# the collapsed cell type; a reviewer's finer reading goes in the judgment's free-text
# `fine_label`, not in the label.
#
# DRAFT by the agent (Lane F, 2026-10-07) for the owner's approval (Lane F plan section 8,
# decision 5: agent-drafted Cell Ontology vocabularies). `terms` gives the Cell Ontology id and
# name each label stands for; the engine reads only `labels`.
#
# Reviewer labels that are not cell types:
#   mixed_doublet  a cluster whose markers are two lineages' at once (segmentation spill-over in
#                  Xenium rather than true doublets); a person decides whether to subcluster
#   low_quality    a cluster held together by low counts or low genes rather than by markers
#   unknown        the evidence does not support any label in this list
# Terms corrected 2026-10-08 against OLS, labels unchanged: enteric_glia CL:4040002 (was
# CL:0002481, peritubular myoid cell), red_pulp_macrophage CL:0000874 (was CL:0000869, tonsillar
# macrophage), intestinal_stem_cell CL:0002250 (was CL:0009016, the large-intestine term); two
# names follow the ontology's current wording (tuft cell, multiciliated epithelial cell).
