# cell_types_mouse@2: cell_types_mouse@1 with nine cell types the Lyons CLP lung and gut runs
# (2026-10-08) showed missing. Same scope and level as @1: one closed list for liver, spleen, lung and
# small intestine, labels at the collapsed level, a reviewer's finer reading in the judgment's
# free-text `fine_label` (endothelial subtypes such as aerocyte or arterial stay there, so every
# organ's endothelium joins on one label). @1 is kept unchanged for the projects that pinned it.
#
# Added, with the evidence that asked for them:
#   cardiomyocyte               lung cluster 21 (Ttn, Actn2, Tnnt2; pulmonary vein sleeve), called unknown
#   adipocyte                   lung cluster 22 (brown: Ucp1, Cidea) and gut cluster 17 (Adipoq, Lep,
#                               Retn), both called unknown; brown or white goes in fine_label
#   transit_amplifying_cell     gut cluster 7: two reviewers chose intestinal_stem_cell while writing
#                               "not stem cells proper" (Lgr5 low, Krt19, Dmbt1, Cdx1)
#   eosinophil, basophil        granulocytes of gut lamina propria and septic lung with no label but
#                               neutrophil or mast_cell
#   hematopoietic_progenitor    emergency haematopoiesis in septic spleen, beside erythroid and
#                               megakaryocyte
#   pulmonary_neuroendocrine_cell  the lung's counterpart of enteroendocrine_cell
#   interstitial_cell_of_cajal  gut muscularis pacemaker cells (Kit, Ano1), otherwise smooth_muscle
#   schwann_cell                nerve glia outside the gut (enteric_glia is the gut's)
#
# Drafted by the agent (2026-10-08, after the lung and gut deliveries) at the owner's request;
# Cell Ontology ids checked against OLS that day. The engine reads only `labels`.
#
# Reviewer labels that are not cell types:
#   mixed_doublet  a cluster whose markers are two lineages' at once (segmentation spill-over in
#                  Xenium rather than true doublets); a person decides whether to subcluster
#   low_quality    a cluster held together by low counts or low genes rather than by markers
#   unknown        the evidence does not support any label in this list; name the cell type
#                  in fine_label when the markers show one
