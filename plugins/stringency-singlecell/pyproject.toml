[project]
name = "stringency-singlecell"
version = "0.1.3"
description = "stringency domain plugin for single-cell and spatial (Xenium) analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["stringency>=0.1.0", "pydantic>=2.7", "pyyaml>=6.0"]

[project.entry-points."stringency.plugins"]
singlecell = "stringency_singlecell:PLUGIN"

[project.optional-dependencies]
extractors = ["pyarrow>=17", "h5py>=3.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hatchling ships every file under the package: the vocabularies/*.yml and tools/*.py the plugin
# loads at import time. The default backend shipped only .py files (found 2026-09-18 when
# punch_qc_verdict@1 was missing from the installed plugin).
packages = ["src/stringency_singlecell"]
