[project]
name = "stringency-singlecell"
version = "0.1.2"
description = "stringency domain plugin for single-cell and spatial (Xenium) analysis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["stringency>=0.1.0", "pydantic>=2.7", "pyyaml>=6.0"]

[project.entry-points."stringency.plugins"]
singlecell = "stringency_singlecell:PLUGIN"

[project.optional-dependencies]
extractors = ["pyarrow>=17", "h5py>=3.10"]
